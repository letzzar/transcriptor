[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "transcriptor"
version = "0.2.0"
description = "Transcripción y auditoría de audio con diarización (PySide6)"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "letzzar" }]

# Runtime deps. Las pesadas (torch, pyannote, faster-whisper, mlx-whisper)
# se instalan según se vayan necesitando por fase. Aquí solo lo mínimo
# para arrancar la UI (F0).
dependencies = [
    "PySide6>=6.7",
]

[project.optional-dependencies]
# Motores y pipeline (F2-F4)
engines = [
    "huggingface_hub>=0.24",
    "faster-whisper>=1.0",
    "pyannote.audio>=3.3",
    "torch>=2.3",
    "transformers>=4.40",  # modelo de estimación de género por voz
]
mlx = [
    "mlx-whisper>=0.4 ; sys_platform == 'darwin' and platform_machine == 'arm64'",
]
report = [
    "fpdf2>=2.7",
    "tinytag>=2.0",
]
secrets = [
    "keyring>=25",
]

dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.10",
    "pyinstaller>=6.0",
]

[project.scripts]
transcriptor = "transcriptor.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Recursos en runtime: fuentes DejaVu (PDF UTF-8) e icono de la app.
transcriptor = ["resources/fonts/*.ttf", "resources/*.ico", "resources/*.icns"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = false  # strict solo en pipeline/ y engines/ (override abajo)

[[tool.mypy.overrides]]
module = ["transcriptor.pipeline.*", "transcriptor.engines.*"]
strict = true

# Dependencias sin stubs de tipos.
#   mlx-whisper / faster-whisper: motores opcionales por plataforma (en cada SO
#   falta uno de los dos). tqdm: sin py.typed (lo usa download_worker).
[[tool.mypy.overrides]]
# `mlx_whisper.*` cubre también los submódulos (audio, decoding, load_models),
# que usa la detección de idioma por ventana de `engines/mlx_engine.py`.
module = ["mlx_whisper", "mlx_whisper.*", "faster_whisper", "ctranslate2", "tqdm"]
ignore_missing_imports = true
