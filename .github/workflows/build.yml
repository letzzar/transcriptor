name: Build instaladores

# Compila el bundle thin (PyInstaller, Opcion C) y el instalador online de
# Windows (Inno Setup). Se lanza a mano (workflow_dispatch) o al pushear un
# tag v* (ademas publica una Release con el instalador).
#
# El instalador OFFLINE (~8 GB, modelos HF gated) NO se construye aqui:
# excede el limite de 2 GiB por archivo de las releases y requiere token HF
# con licencias aceptadas. Se sigue construyendo en local (build_offline.ps1).

on:
  workflow_dispatch:
  push:
    branches: [main, "feat/**"]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # Mismo layout que la copia local D:: un .venv con solo las deps del
      # bundle thin (el stack pesado esta excluido en transcriptor.spec y se
      # descarga en el 1er arranque). huggingface_hub/tinytag/tqdm son imports
      # perezosos pero PyInstaller los congela igual, y la app los necesita.
      - name: Crear venv e instalar dependencias
        shell: cmd
        run: |
          python -m venv .venv
          .venv\Scripts\python -m pip install --upgrade pip
          .venv\Scripts\pip install -e .[report,secrets] "huggingface_hub>=0.24" tqdm pyinstaller

      # Copia el Python embebido (base_prefix del venv) y corre PyInstaller.
      # Salida: dist\Transcriptor\Transcriptor.exe
      - name: Build PyInstaller (bundle thin)
        shell: cmd
        run: scripts\build_windows.bat

      # Inno Setup 6 viene preinstalado en los runners windows-latest.
      # Salida: dist\Transcriptor-Setup.exe
      - name: Compilar instalador (Inno Setup)
        shell: cmd
        run: '"%ProgramFiles(x86)%\Inno Setup 6\ISCC.exe" scripts\installer.iss'

      - name: Subir artefacto
        uses: actions/upload-artifact@v7
        with:
          name: Transcriptor-Setup-win64
          path: dist/Transcriptor-Setup.exe
          if-no-files-found: error

      - name: Publicar Release (solo tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/Transcriptor-Setup.exe

  # .app para Apple Silicon (los runners macos-latest son arm64, igual que el
  # Mac del Director; el motor MLX requiere arm64 de todos modos).
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Crear venv e instalar dependencias
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e .[report,secrets] "huggingface_hub>=0.24" tqdm pyinstaller

      # Descarga el Python embebido (python-build-standalone) y corre PyInstaller.
      - name: Build PyInstaller (.app)
        run: |
          source .venv/bin/activate
          bash scripts/build_unix.sh

      # DMG con el .app y un enlace a /Applications (drag & drop clásico).
      - name: Crear DMG
        run: |
          mkdir dist/dmg
          cp -R dist/Transcriptor.app dist/dmg/
          ln -s /Applications dist/dmg/Applications
          hdiutil create -volname Transcriptor -srcfolder dist/dmg -ov -format UDZO \
            dist/Transcriptor-macOS-arm64.dmg

      - name: Subir artefacto
        uses: actions/upload-artifact@v7
        with:
          name: Transcriptor-macOS-arm64
          path: dist/Transcriptor-macOS-arm64.dmg
          if-no-files-found: error

      - name: Publicar Release (solo tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/Transcriptor-macOS-arm64.dmg

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # Libs de sistema que Qt necesita para que el hook de PySide6 cargue
      # durante el análisis de PyInstaller.
      - name: Instalar libs de Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon0

      - name: Crear venv e instalar dependencias
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e .[report,secrets] "huggingface_hub>=0.24" tqdm pyinstaller

      - name: Build PyInstaller (onedir)
        run: |
          source .venv/bin/activate
          bash scripts/build_unix.sh

      # tar.gz preserva permisos y symlinks (a diferencia del zip del artifact).
      - name: Empaquetar tar.gz
        run: tar -C dist -czf dist/Transcriptor-linux-x86_64.tar.gz Transcriptor

      - name: Subir artefacto
        uses: actions/upload-artifact@v7
        with:
          name: Transcriptor-linux-x86_64
          path: dist/Transcriptor-linux-x86_64.tar.gz
          if-no-files-found: error

      - name: Publicar Release (solo tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/Transcriptor-linux-x86_64.tar.gz
